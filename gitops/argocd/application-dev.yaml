apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civic-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Speedzone247/SRE_project.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
